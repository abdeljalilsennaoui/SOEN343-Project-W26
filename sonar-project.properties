# ─── SonarCloud project identity ────────────────────────────────────────────
# Replace these two values with your actual SonarCloud org and project key.
# They are shown in SonarCloud → Administration → Project Settings.
sonar.organization=abdeljalilsennaoui
sonar.projectKey=abdeljalilsennaoui_SOEN343-Project-W26
sonar.projectName=SUMMS

# ─── Source & test roots ─────────────────────────────────────────────────────
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests

# ─── Language / encoding ─────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ─── Exclusions ──────────────────────────────────────────────────────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/__mocks__/**,\
  **/coverage/**,\
  **/scripts/**,\
  backend/src/server.js

sonar.test.exclusions=**/node_modules/**

# ─── Coverage (lcov generated by jest --coverage) ────────────────────────────
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
