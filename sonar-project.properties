# ─── SonarCloud project identity ────────────────────────────────────────────
# Replace these two values with your actual SonarCloud org and project key.
# They are shown in SonarCloud → Administration → Project Settings.
sonar.organization=abdeljalilsennaoui
sonar.projectKey=abdeljalilsennaoui_SOEN343-Project-W26
sonar.projectName=SUMMS

# ─── Source & test roots ─────────────────────────────────────────────────────
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests

# ─── Language / encoding ─────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ─── Exclusions ──────────────────────────────────────────────────────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/__mocks__/**,\
  **/coverage/**,\
  **/scripts/**,\
  backend/src/server.js

sonar.test.exclusions=**/node_modules/**

# ─── Coverage (lcov generated by jest --coverage) ────────────────────────────
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# ─── Coverage exclusions (files that cannot be unit tested) ──────────────────
# Excluded from the coverage denominator — these require HTTP context, live
# Firestore, Firebase Admin init, or are pure wiring/entry-point code.
sonar.coverage.exclusions=\
  frontend/src/**,\
  backend/src/server.js,\
  backend/src/routes/**,\
  backend/src/middleware/**,\
  backend/src/controllers/**,\
  backend/src/gateways/**,\
  backend/src/scripts/**,\
  backend/src/models/User.js,\
  backend/src/models/Vehicle.js,\
  backend/src/models/Reservation.js,\
  backend/src/models/Payment.js,\
  backend/src/models/Parking.js,\
  backend/src/models/AnalyticsReport.js,\
  backend/src/models/MobilityOption.js,\
  backend/src/models/Booking.js,\
  backend/src/models/PaymentReceipt.js,\
  backend/src/models/enums.js,\
  backend/src/mvc/MobilityController.js,\
  backend/src/mvc/MobilityPresenter.js,\
  backend/src/mvc/MobilityRequestHandler.js,\
  backend/src/mvc/MobilityDataGateway.js,\
  backend/src/commands/CommandRegistry.js,\
  backend/src/lib/firebaseAdmin.js,\
  backend/src/lib/firestore.js,\
  backend/src/services/AnalyticsListener.js,\
  backend/src/services/TransitAdapter.js,\
